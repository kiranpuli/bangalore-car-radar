name: Daily Spinny Deal Refresh & Deploy

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Fresh Bangalore Deals & Rebuild UI
        run: |
          python spinny_checker.py --city bangalore --max-price 0

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html deals.html clean_bangalore_cars.json latest_alerts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh Bangalore deals" && git push)
